<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description"
      content="Submit product reviews using an interactive form that collects ratings, installation dates, useful features, and customer feedback.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Paul Clement">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <fieldset>
                <legend>Product Information</legend>

                <label for="product">
                    Product Name *
                </label>

                <select id="product" name="product" required>
                    <option value="" selected disabled>
                        Select a Product ...
                    </option>
                </select>

                <label>Overall Rating *</label>

                <div class="ratings">


                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating1">★</label>


                    <input type="radio" id="rating2" name="rating" value="2" required>

                    <label for="rating2">★★</label>


                    <input type="radio" id="rating3" name="rating" value="3" required>

                    <label for="rating3">★★★</label>


                    <input type="radio" id="rating4" name="rating" value="4" required>

                    <label for="rating4">★★★★</label>


                    <input type="radio" id="rating5" name="rating" value="5" required>

                    <label for="rating5">★★★★★</label>

                </div>

                <label for="installDate">
                    Date of Installation *
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </fieldset>

            <fieldset>

                <legend>Useful Features</legend>


                <input type="checkbox" id="durability" name="features" value="Durability">
                <label for="durability">Durability</label>


                <input type="checkbox" id="ease" name="features" value="Ease of Use">
                <label for="ease">Ease of Use</label>


                <input type="checkbox" id="performance" name="features" value="Performance">
                <label for="performance">Performance</label>


                <input type="checkbox" id="design" name="features" value="Design">
                <label for="design">Design</label>

            </fieldset>

            <fieldset>

                <legend>Review Details</legend>

                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="6"></textarea>

                <label for="username">
                    Your Name
                </label>

                <input type="text" id="username" name="username">

            </fieldset>

            <input type="submit" value="Post Review">

        </form>

    </main>

    <footer>
        <p>
            © <span id="currentyear"></span> | Paul Clement | Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
