<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Lagos Food Guide and share your favorite Lagos food experience.">
    <title>Contact | Lagos Food Guide</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Lagos Food Guide</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="foods.html">Foods</a></li>
                <li><a href="restaurants.html">Restaurants</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="page-header">
            <h2>Contact Us</h2>
            <p> Tell us about your favorite Lagos food and dining experiences. </p>
        </section>
        <section class="form-section">
            <form id="foodForm">
                <div class="form-group"> <label for="fullName">Full Name</label> <input type="text"
                      id="fullName" name="fullName" required> </div>
                <div class="form-group"> <label for="email">Email Address</label> <input
                      type="email" id="email" name="email" required> </div>
                <div class="form-group"> <label for="favoriteFood">Favorite Lagos Food</label>
                    <input type="text" id="favoriteFood" name="favoriteFood" required>
                </div>
                <div class="form-group"> <label for="message">Message</label> <textarea id="message"
                      name="message" rows="5" required></textarea> </div> <button type="submit"
                  class="btn"> Submit </button>
            </form>
            <div id="savedMessage"></div>
        </section>
    </main>
    <footer>
        <p> &copy; <span id="currentyear"></span> Lagos Food Guide </p>
        <p id="lastModified"></p> <a href="references.html">References</a>
    </footer>
</body>

</html>
